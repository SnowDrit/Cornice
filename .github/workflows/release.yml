name: Release

# Pushing a tag is the whole trigger. Tag the commit you want released, push the
# tag, and the build that comes out is the one that was tagged.
on:
  push:
    tags:
      - "v*"
  # Also runnable by hand, for rehearsing the build without cutting a release.
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload to it

jobs:
  build:
    # Cornice targets macOS 26, so the runner has to carry an SDK that new. If this
    # image ever lags behind, that is what fails first and the log says so plainly.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode on the runner
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Cornice.xcodeproj \
            -scheme Cornice \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Check what came out
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Cornice.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist"
          # The sandbox must be off, or the app silently sees only its own status item.
          if codesign -d --entitlements - "$app" 2>/dev/null | grep -q "app-sandbox"; then
            echo "::error::built app is sandboxed; it will see only its own menu bar item"
            exit 1
          fi
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Identifier|Signature" || true

      - name: Package
        run: |
          set -euo pipefail
          # ditto rather than zip: it preserves the bundle's symlinks and metadata,
          # which a plain zip mangles.
          ditto -c -k --keepParent \
            "build/Build/Products/Release/Cornice.app" \
            "Cornice.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Cornice
          path: Cornice.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Create if absent, otherwise just attach the build to the existing release,
          # so notes written by hand are never overwritten by a re-run.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Cornice.zip --clobber
          else
            gh release create "$tag" Cornice.zip \
              --title "Cornice $tag" \
              --prerelease \
              --generate-notes
          fi
