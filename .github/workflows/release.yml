name: Release

# Pushing a tag is the whole trigger. Tag the commit you want released, push the
# tag, and the build that comes out is the one that was tagged.
on:
  push:
    tags:
      - "v*"
  # Also runnable by hand. Naming a tag publishes to it, which is the way back in
  # when a tag was pushed before this workflow existed and so never triggered it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (blank = build only)"
        required: false
        default: ""

permissions:
  contents: write   # needed to create the release and upload to it

jobs:
  build:
    # Cornice targets macOS 26, so the runner has to carry an SDK that new. If this
    # image ever lags behind, that is what fails first and the log says so plainly.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag that was asked for, not whatever main happens to be.
          ref: ${{ inputs.tag || github.ref }}

      - name: Pick the newest Xcode on the runner
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Cornice.xcodeproj \
            -scheme Cornice \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Check what came out
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Cornice.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist"
          # The sandbox must be off, or the app silently sees only its own status item.
          if codesign -d --entitlements - "$app" 2>/dev/null | grep -q "app-sandbox"; then
            echo "::error::built app is sandboxed; it will see only its own menu bar item"
            exit 1
          fi
          # A shipped build must not carry get-task-allow. It lets any process running as
          # the same user attach to Cornice and read or rewrite its memory, and Cornice is
          # a process that holds Accessibility and owns an event tap, so borrowing it means
          # borrowing those. Xcode injects the entitlement for development-style signing,
          # which is why the Release configuration turns the injection off, and why this
          # checks the finished bundle rather than trusting the setting.
          if codesign -d --entitlements - "$app" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::built app allows debugger attach; its Accessibility grant could be borrowed"
            exit 1
          fi
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Identifier|Signature" || true

      - name: Package
        run: |
          set -euo pipefail
          chmod +x scripts/make-dmg.sh
          scripts/make-dmg.sh "build/Build/Products/Release/Cornice.app" "Cornice.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Cornice
          path: Cornice.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          notes="docs/releases/${tag#v}.md"

          # The description lives in the repository, beside the commits it describes, so
          # it travels with the tag and there is no step anyone can forget. Every release
          # up to v0.2.1 went out carrying nothing but the generated compare link, because
          # the real text was something a person had to remember to paste afterwards, and
          # nobody ever did.
          if [ ! -f "$notes" ]; then
            echo "::warning::$notes is missing, falling back to generated notes"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Cornice.dmg --clobber
            # Re-runs used to leave the description alone, to protect what had been typed
            # into the web form. Now that the description is a file under review, the file
            # is the thing to trust.
            if [ -f "$notes" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$tag" Cornice.dmg \
              --title "Cornice $tag" \
              --notes-file "$notes"
          else
            gh release create "$tag" Cornice.dmg \
              --title "Cornice $tag" \
              --generate-notes
          fi
