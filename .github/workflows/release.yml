name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (blank always builds only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      # This installed toolchain includes SDK 26.5. Never silently select a newer SDK.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate the release reference
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          fi
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(git rev-parse --verify "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
            test -f "docs/releases/${tag#v}.md"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify the toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(uname -m)" = "arm64"
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.5\nBuild version 17F42')"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "26.5"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Cornice.xcodeproj \
            -scheme Cornice \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify the release bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release.py \
            "build/Build/Products/Release/Cornice.app" --tag "$RELEASE_TAG"

      - name: Package
        run: |
          set -euo pipefail
          bash scripts/make-dmg.sh "build/Build/Products/Release/Cornice.app" "Cornice.dmg"
          hdiutil verify Cornice.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Cornice
          path: Cornice.dmg
          if-no-files-found: error

      - name: Publish the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Cornice.dmg --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" Cornice.dmg \
              --verify-tag --title "Cornice $RELEASE_TAG" --notes-file "$notes"
          fi
